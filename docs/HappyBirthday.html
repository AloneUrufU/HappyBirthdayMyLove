<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Montserrat:wght@300;400&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
  }

  body {
    background: linear-gradient(160deg, #1a0b1f, #2d1b2e, #3d1f3a);
    overflow: hidden;
    position: relative;
    font-family: 'Montserrat', sans-serif;
    color: #ffe4ec;
    user-select: none;
    transition: filter 1.2s ease;
  }

  body.dimmed {
    filter: brightness(0.72);
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle linear infinite;
    pointer-events: none;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .bg-heart {
    position: absolute;
    color: #ff6b8a;
    opacity: 0;
    animation: floatHeart 10s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes floatHeart {
    0% {
      opacity: 0;
      transform: translateY(100vh) scale(0.6) rotate(0deg);
    }
    20% { opacity: 0.4; }
    80% { opacity: 0.3; }
    100% {
      opacity: 0;
      transform: translateY(-80px) scale(1.1) rotate(20deg);
    }
  }

  .petal {
    position: absolute;
    font-size: 14px;
    color: #ff8fab;
    opacity: 0;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 2;
  }

  @keyframes fall {
    0% {
      opacity: 0;
      transform: translateY(-30px) rotate(0deg);
    }
    10% { opacity: 0.5; }
    90% { opacity: 0.4; }
    100% {
      opacity: 0;
      transform: translateY(100vh) rotate(360deg);
    }
  }

  .text-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 86%;
    max-width: 380px;
    text-align: center;
    z-index: 10;
    padding: 0 10px;
  }

  .block {
    display: none;
    font-size: 18.5px;
    line-height: 1.75;
    letter-spacing: 0.2px;
    min-height: 160px;
  }

  .block.active {
    display: block;
  }

  .block .line {
    margin-bottom: 7px;
    min-height: 1.4em;
  }

  /* мигающий курсор */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.05em;
    background: #ffb6c1;
    margin-left: 1px;
    vertical-align: text-bottom;
    animation: blink 0.85s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0; }
  }

  /* финальное сердце */
  .final-heart {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 15;
    animation: fadeIn 1.2s ease;
  }

  .final-heart .heart {
    font-size: 92px;
    color: #ff6b8a;
    filter: drop-shadow(0 0 28px rgba(255, 107, 138, 0.65));
    margin-bottom: 16px;
    animation: heartbeat 2s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .final-heart .caption {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: #fff;
    text-shadow: 0 0 15px rgba(255, 182, 193, 0.5);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translate(-50%, -40%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
  }

  .hint {
    position: absolute;
    bottom: 35px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: rgba(255, 182, 193, 0.55);
    letter-spacing: 1px;
    z-index: 5;
    transition: all 0.7s ease;
  }

  .hint.hidden {
    opacity: 0;
    transform: translateY(18px);
    pointer-events: none;
  }

  .reread-btn {
    display: none;
    position: absolute;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 107, 138, 0.2);
    border: 1px solid rgba(255, 182, 193, 0.4);
    color: #ffb6c1;
    padding: 12px 28px;
    border-radius: 50px;
    font-size: 14px;
    letter-spacing: 0.5px;
    cursor: pointer;
    z-index: 20;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
  }

  .reread-btn:active {
    transform: translateX(-50%) scale(0.96);
  }

  .flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255, 182, 193, 0.25) 0%, transparent 70%);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.6s ease;
  }

  .flash.show {
    opacity: 1;
  }
</style>
</head>
<body>

  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div id="stars"></div>
  <div id="petals"></div>
  <div class="flash" id="flash"></div>

  <div class="bg-heart" style="left: 15%; animation-delay: 0s; font-size: 16px;">♥</div>
  <div class="bg-heart" style="left: 70%; animation-delay: 3s; font-size: 20px;">♥</div>
  <div class="bg-heart" style="left: 40%; animation-delay: 6s; font-size: 14px;">♡</div>
  <div class="bg-heart" style="left: 85%; animation-delay: 8s; font-size: 18px;">♥</div>

  <div class="text-container" id="textContainer">
    <div class="block active">
      <div class="line" data-text="Котёнок мой… Катюша…"></div>
      <div class="line" data-text="Сегодня тебе уже 17."></div>
      <div class="line" data-text="И я до сих пор не могу до конца поверить,"></div>
      <div class="line" data-text="как быстро пролетело время."></div>
    </div>

    <div class="block">
      <div class="line" data-text="Кажется, совсем недавно"></div>
      <div class="line" data-text="ты была совсем крошечной,"></div>
      <div class="line" data-text="а сейчас вот — такая красивая,"></div>
      <div class="line" data-text="сильная и всё равно моя родная девочка."></div>
    </div>

    <div class="block">
      <div class="line" data-text="Я хочу, чтобы этот день"></div>
      <div class="line" data-text="был для тебя особенным."></div>
      <div class="line" data-text="Не просто ещё одним днём рождения,"></div>
      <div class="line" data-text="а настоящим праздником внутри."></div>
    </div>

    <div class="block">
      <div class="line" data-text="Чтобы ты утром проснулась с улыбкой,"></div>
      <div class="line" data-text="чтобы весь день чувствовала,"></div>
      <div class="line" data-text="как сильно тебя любят."></div>
      <div class="line" data-text="Ты важна. Ты нужна. Ты — чудо."></div>
    </div>

    <div class="block">
      <div class="line" data-text="Пусть этот год станет самым светлым."></div>
      <div class="line" data-text="Пусть в нём будет много смеха,"></div>
      <div class="line" data-text="тёплых объятий и моментов,"></div>
      <div class="line" data-text="от которых мурашки по коже."></div>
    </div>

    <div class="block">
      <div class="line" data-text="Катюша… котик мой…"></div>
      <div class="line" data-text="Спасибо, что ты есть."></div>
      <div class="line" data-text="Спасибо, что позволяешь мне быть рядом."></div>
      <div class="line" data-text="С днём рождения."></div>
      <div class="line" data-text="Люблю тебя. Очень сильно."></div>
    </div>
  </div>

  <div class="final-heart" id="finalHeart">
    <div class="heart">♥</div>
    <div class="caption">С 17-летием, Катюша</div>
  </div>

  <div class="hint" id="hint">двойной тап, чтобы продолжить</div>
  <button class="reread-btn" id="rereadBtn">прочитать ещё раз</button>

<script>
  const music = document.getElementById('bgMusic');
  music.volume = 0.55;

  function tryPlay() {
    music.play().catch(() => {});
  }
  tryPlay();

  document.body.addEventListener('touchstart', () => {
    if (music.paused) music.play();
  }, { once: true });

  document.body.addEventListener('click', () => {
    if (music.paused) music.play();
  }, { once: true });

  function playSoftSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 680;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.035, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.16);
    } catch(e) {}
  }

  // звёзды + лепестки
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 65; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.8 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.animationDuration = (1.8 + Math.random() * 3) + 's';
    star.style.animationDelay = Math.random() * 4 + 's';
    starsContainer.appendChild(star);
  }

  const petalsContainer = document.getElementById('petals');
  for (let i = 0; i < 12; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.innerHTML = '❀';
    petal.style.left = Math.random() * 100 + 'vw';
    petal.style.animationDuration = (9 + Math.random() * 8) + 's';
    petal.style.animationDelay = Math.random() * 10 + 's';
    petal.style.fontSize = (12 + Math.random() * 10) + 'px';
    petalsContainer.appendChild(petal);
  }

  // ===== ПЕЧАТЬ БУКВА ЗА БУКВОЙ =====
  const blocks = document.querySelectorAll('.block');
  const textContainer = document.getElementById('textContainer');
  const finalHeart = document.getElementById('finalHeart');
  const hint = document.getElementById('hint');
  const rereadBtn = document.getElementById('rereadBtn');
  const flash = document.getElementById('flash');

  let current = 0;
  let lastTap = 0;
  let finished = false;
  let isTyping = false;

  function typeBlock(block) {
    isTyping = true;
    const lines = [...block.querySelectorAll('.line')];
    
    // очищаем
    lines.forEach(line => {
      line.innerHTML = '';
    });

    let lineIndex = 0;
    let charIndex = 0;

    function typeNext() {
      if (lineIndex >= lines.length) {
        // печать закончена
        const lastLine = lines[lines.length - 1];
        const cursor = lastLine.querySelector('.cursor');
        if (cursor) {
          setTimeout(() => cursor.remove(), 900);
        }
        isTyping = false;
        return;
      }

      const line = lines[lineIndex];
      const fullText = line.getAttribute('data-text');

      if (charIndex === 0) {
        // добавляем курсор
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        line.appendChild(cursor);
      }

      if (charIndex < fullText.length) {
        // добавляем следующую букву перед курсором
        const cursor = line.querySelector('.cursor');
        const textNode = document.createTextNode(fullText[charIndex]);
        line.insertBefore(textNode, cursor);
        charIndex++;
        
        // разная скорость: быстрее на пробелах и знаках
        const char = fullText[charIndex - 1];
        let delay = 42;
        if (char === ' ') delay = 28;
        if (char === '.' || char === ',' || char === '…') delay = 180;
        if (char === '!') delay = 160;

        setTimeout(typeNext, delay);
      } else {
        // строка закончена — убираем курсор и переходим к следующей
        const cursor = line.querySelector('.cursor');
        if (cursor) cursor.remove();
        
        lineIndex++;
        charIndex = 0;
        setTimeout(typeNext, 380); // пауза между строками
      }
    }

    setTimeout(typeNext, 250);
  }

  // первый блок
  typeBlock(blocks[0]);

  function showNext() {
    if (finished || isTyping) return;

    playSoftSound();

    blocks[current].classList.remove('active');
    current++;

    if (current >= blocks.length) {
      textContainer.style.display = 'none';
      finalHeart.style.display = 'block';
      hint.classList.add('hidden');
      rereadBtn.style.display = 'block';
      document.body.classList.add('dimmed');
      finished = true;
      return;
    }

    blocks[current].classList.add('active');
    typeBlock(blocks[current]);
  }

  document.body.addEventListener('touchend', function(e) {
    if (finished || isTyping) return;
    const now = Date.now();
    if (now - lastTap < 320) {
      showNext();
      e.preventDefault();
    }
    lastTap = now;
  });

  document.body.addEventListener('dblclick', function() {
    if (!finished && !isTyping) showNext();
  });

  rereadBtn.addEventListener('click', function() {
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 700);

    document.body.classList.remove('dimmed');
    finalHeart.style.display = 'none';
    textContainer.style.display = 'block';
    blocks.forEach(b => b.classList.remove('active'));
    current = 0;
    blocks[0].classList.add('active');
    finished = false;
    hint.classList.remove('hidden');
    rereadBtn.style.display = 'none';
    typeBlock(blocks[0]);
  });
</script>
</body>
</html>
